<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;

        }

        /* Экран загрузки */
        .welcome-screen {
            position: fixed;
            inset: 0;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #111;
        }

        .welcome-title {
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
        }

        .loading-text {
            color: #aaa;

        }

        /* Нижняя полоска */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 10;

            display: flex;
            align-items: center;

            width: 100%;
            height: 28px;
            padding-left: 10px;

            background: #262626;
        }

        .author {
            font-family: Arial, sans-serif;
            font-size: 10px;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="welcome-screen">
        <div class="welcome-title">MUZER play</div>
        <div class="loading-text">Открываем мобильную версию...</div>
    </main>

    <footer class="bottom-bar">
        <a
            class="author"
            href="https://vk.ru/muzer_play"
            target="_blank"

        </a>
    </footer>

    <script>
        const MOBILE_URL = 'https://m.vk.ru/games/app54612661';

        async function initApp() {
            try {
                await vkBridge.send('VKWebAppInit');
            } catch (e) {
                console.error('Ошибка VK Bridge:', e);
            }

            // Автоматический переход на мобильную версию
            window.location.replace(MOBILE_URL);
        }

        initApp();
    </script>

</body>
</html>
