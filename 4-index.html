```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUZER play VK Mini App</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        /* Экран входа */
        .welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 10000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;

            padding: 20px;
            padding-bottom: 48px;
            background: #111;
        }

        .welcome-title {
            color: #fff;
            font-size: 23px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }

        .version-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 320px;
            min-height: 58px;
            padding: 15px;

            border: none;
            border-radius: 14px;

            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;

            transition: transform 0.15s, opacity 0.15s;
        }

        .version-button:active {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .mobile-button {
            background: #0077ff;
        }

        .pc-button {
            background: #303030;
            border: 1px solid #555;
        }

        /* Нижняя полоска */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 10001;

            width: 100%;
            height: 28px;
            padding-left: 10px;

            display: flex;
            align-items: center;

            background: #262626;
        }

        .author {
            color: #fff;
            font-size: 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- Кнопки только на стартовом экране -->
    <div class="welcome-screen">

        <div class="welcome-title">MUZER play</div>

        <a
            class="version-button mobile-button"
            href="https://m.vk.ru/games/app54612661?section_type=public_r_app">
            📱 МОБИЛЬНАЯ ВЕРСИЯ
        </a>

        <a
            class="version-button pc-button"
            href="https://vk.ru/games/app54612661?section_type=public_r_app">
            💻 ПК ВЕРСИЯ
        </a>

    </div>

    <div class="bottom-bar">
        <a
            class="author"
            href="https://vk.ru/muzer_play"
            target="_blank"
            rel="noopener noreferrer">
            Автор приложения
        </a>
    </div>

    <script>
        async function initApp() {
            try {
                await vkBridge.send('VKWebAppInit');
            } catch (e) {
                console.error('Ошибка VK Bridge:', e);
            }
        }

        initApp();
    </script>

</body>
</html>
```
