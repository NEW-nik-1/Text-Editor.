```html
<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Радио + Чат</title>


<!-- =========================
     VK BRIDGE
     ========================= -->

<script>

(function(){

  try{

    if(
      window.vkBridge &&
      typeof window.vkBridge.send === "function"
    ){

      window.vkBridge
        .send("VKWebAppInit")
        .then(function(){

          document.documentElement
            .classList
            .add("vk-ready");

        })
        .catch(function(err){

          console.warn(
            "VK Bridge init failed:",
            err
          );

        });

    }

  }catch(err){

    console.warn(
      "VK Bridge unavailable:",
      err
    );

  }

})();

</script>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 20%,
            #3d3d3d 0%,
            #1b1b1b 45%,
            #101010 100%
        );

    font-family: Arial, sans-serif;

    color: white;
}


/* =========================
   РАДИОПЛЕЕР
   ========================= */

#radioPlayer {

    position: fixed;

    right: 20px;
    bottom: 560px;

    width: 300px;
    min-height: 82px;

    padding: 12px 14px;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            #626262,
            #3c3c3c 55%,
            #292929
        );

    border: 1px solid #777;

    box-shadow:
        0 12px 35px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.18);

    z-index: 999998;
}


/* Верхняя строка */

.player-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 10px;
}


/* Название */

.radio-name {

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 2px;

    color: #f0f0f0;
}


/* LIVE */

.live {

    display: flex;

    align-items: center;

    gap: 5px;

    font-size: 9px;

    letter-spacing: 1px;

    color: #ddd;
}


/* Точка LIVE */

.live-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #aaa;

    box-shadow:
        0 0 8px #aaa;

}


/* Управление */

.player-controls {

    display: flex;

    align-items: center;

    gap: 10px;
}


/* PLAY */

#playButton {

    width: 40px;

    height: 40px;

    border: none;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #858585,
            #4a4a4a
        );

    color: white;

    font-size: 17px;

    cursor: pointer;

    box-shadow:
        0 4px 10px rgba(0,0,0,.4),
        inset 0 1px 1px rgba(255,255,255,.2);

    transition: .2s;
}


#playButton:hover {

    transform: scale(1.06);

    background:
        linear-gradient(
            145deg,
            #999,
            #555
        );
}


#playButton:active {

    transform: scale(.96);

}


/* Громкость */

.volume-area {

    flex: 1;

    display: flex;

    align-items: center;

    gap: 8px;
}


#volumeIcon {

    font-size: 17px;

    width: 20px;

    text-align: center;
}


#volume {

    width: 100%;

    cursor: pointer;

    accent-color: #cfcfcf;
}


.volume-value {

    width: 30px;

    text-align: right;

    font-size: 10px;

    color: #ddd;
}


/* =========================
   ЧАТ
   ========================= */

#chatContainer {

    position: fixed;

    right: 20px;

    bottom: 20px;

    width: 300px;

    height: 520px;

    border-radius: 16px;

    overflow: hidden;

    box-shadow:
        0 12px 35px rgba(0,0,0,.55);

    z-index: 999997;
}


/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
   ========================= */

@media (max-width: 500px) {

    #radioPlayer {

        right: 10px;

        bottom: 560px;

        width:
            calc(100vw - 20px);

    }


    #chatContainer {

        right: 10px;

        bottom: 10px;

        width:
            calc(100vw - 20px);

    }

}

</style>

</head>


<body>


<!-- =========================
     РАДИОПЛЕЕР
     ========================= -->

<div id="radioPlayer">

    <div class="player-top">

        <div class="radio-name">
            RADIO
        </div>

        <div class="live">

            <span class="live-dot"></span>

            LIVE

        </div>

    </div>


    <div class="player-controls">


        <button
            id="playButton"
            type="button"
            title="Включить радио"
        >

            ▶

        </button>


        <div class="volume-area">


            <span id="volumeIcon">

                🔊

            </span>


            <input
                id="volume"
                type="range"
                min="0"
                max="100"
                value="80"
            >


            <span
                id="volumeValue"
                class="volume-value"
            >

                80%

            </span>


        </div>


    </div>

</div>


<!-- =========================
     АУДИОПОТОК
     ========================= -->

<audio
    id="radioAudio"
    preload="none"
    src="https://s05.volnorez.com/live-app/tmp/6aac4338-77666a80b93c37e2275cb30b73c493c1e4a27"
>
</audio>


<!-- =========================
     ЧАТ
     ========================= -->

<div id="chatContainer">


    <script
        src="https://chatodrom.com/chat/embed.js"
        data-title="Чат"
        data-open="true"
        data-chat-id="chat-radio"
        data-mode="floating"
        data-position="bottom-right"
        data-width="300"
        data-height="520"
        data-offset-x="0"
        data-offset-y="0"
    ></script>


</div>


<!-- =========================
     JAVASCRIPT ПЛЕЕРА
     ========================= -->

<script>

const audio =
    document.getElementById("radioAudio");


const playButton =
    document.getElementById("playButton");


const volume =
    document.getElementById("volume");


const volumeIcon =
    document.getElementById("volumeIcon");


const volumeValue =
    document.getElementById("volumeValue");



/* Начальная громкость */

audio.volume = 0.8;



/* =========================
   PLAY / PAUSE
   ========================= */

playButton.addEventListener(
    "click",
    async function()
    {

        if(audio.paused){

            try{

                await audio.play();

                playButton.textContent = "❚❚";

                playButton.title =
                    "Остановить радио";

            }

            catch(error){

                console.warn(
                    "Ошибка запуска радио:",
                    error
                );

            }

        }

        else{

            audio.pause();

            playButton.textContent = "▶";

            playButton.title =
                "Включить радио";

        }

    }
);



/* =========================
   ГРОМКОСТЬ
   ========================= */

volume.addEventListener(
    "input",
    function()
    {

        const value =
            Number(this.value);


        audio.volume =
            value / 100;


        volumeValue.textContent =
            value + "%";



        if(value === 0){

            volumeIcon.textContent =
                "🔇";

        }

        else if(value < 50){

            volumeIcon.textContent =
                "🔉";

        }

        else{

            volumeIcon.textContent =
                "🔊";

        }

    }
);



/* =========================
   RADIO PLAY
   ========================= */

audio.addEventListener(
    "play",
    function()
    {

        playButton.textContent =
            "❚❚";

        playButton.title =
            "Остановить радио";

    }
);



/* =========================
   RADIO PAUSE
   ========================= */

audio.addEventListener(
    "pause",
    function()
    {

        playButton.textContent =
            "▶";

        playButton.title =
            "Включить радио";

    }
);



/* =========================
   ОШИБКА ПОТОКА
   ========================= */

audio.addEventListener(
    "error",
    function()
    {

        console.warn(
            "Не удалось загрузить радиопоток."
        );

    }
);

</script>


</body>

</html>
