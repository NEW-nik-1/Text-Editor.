<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Радио Точка импульса</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #radio {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

    <!-- Радио «Точка импульса» -->
    <iframe
        id="radio"
        src="https://m.volnorez.com/tochka-impulsa"
        allow="autoplay; fullscreen"
        loading="eager">
    </iframe>


    <!-- Чат Chatodrom -->
    <script
        src="https://chatodrom.com/chat/embed.js"
        data-title="Чат"
        data-open="true"
        data-chat-id="chat-radio"
        data-mode="floating"
        data-position="bottom-right"
        data-width="300"
        data-height="520"
        data-offset-x="20"
        data-offset-y="100">
    </script>


    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <script>
        (function () {

            try {

                if (
                    window.vkBridge &&
                    typeof window.vkBridge.send === "function"
                ) {

                    window.vkBridge
                        .send("VKWebAppInit")

                        .then(function () {

                            document.documentElement
                                .classList
                                .add("vk-ready");

                            console.log(
                                "VK Bridge initialized"
                            );

                        })

                        .catch(function (err) {

                            console.warn(
                                "VK Bridge init failed:",
                                err
                            );

                        });

                } else {

                    console.warn(
                        "VK Bridge is not available"
                    );

                }

            } catch (err) {

                console.warn(
                    "VK Bridge unavailable:",
                    err
                );

            }

        })();
    </script>

</body>
</html>
